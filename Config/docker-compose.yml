version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebook_shop_web
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ebook_user
      MYSQL_PASSWORD: ebook_password
      MYSQL_DATABASE: e-books
    depends_on:
      - db
    networks:
      - ebook_network
    volumes:
      - ./:/var/www/html

  db:
    image: mariadb:latest
    container_name: ebook_shop_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: ebook_user
      MYSQL_PASSWORD: ebook_password
      MYSQL_DATABASE: e-books
    ports:
      - "3306:3306"
    networks:
      - ebook_network
    volumes:
      - ebook_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ebook_shop_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ebook_user
      PMA_PASSWORD: ebook_password
      PMA_ROOT_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - ebook_network

volumes:
  ebook_data:

networks:
  ebook_network:
    driver: bridge
